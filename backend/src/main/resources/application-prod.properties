spring.application.name=${SPRING_APPLICATION_NAME}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL}&requireSSL=${DB_REQUIRE_SSL}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useLegacyDatetimeCode=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.username=${MAIL_USERNAME}
sendgrid.api.key=${SENDGRID_API_KEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

server.port=${PORT}

# VNPay config
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.secret-key=${VNPAY_HASH_SECRET}

settlement.warning-over-hours=${SETTLEMENT_WARNING_OVER_HOURS}
settlement.lock-over-hours=${SETTLEMENT_LOCK_OVER_HOURS}

payment.min-amount=${PAYMENT_MIN_AMOUNT}
payment.expire-minutes=${PAYMENT_EXPIRE_MINUTES}

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Route optimization microservice
ai.service.base-url=${AI_SERVICE_BASE_URL}

# AI recommendation
ai.service.recommend-connect-timeout-ms=${AI_SERVICE_RECOMMEND_CONNECT_TIMEOUT_MS:2000}
ai.service.recommend-read-timeout-ms=${AI_SERVICE_RECOMMEND_READ_TIMEOUT_MS:4000}
ai.service.recommendation-cache-ttl-seconds=${AI_SERVICE_RECOMMENDATION_CACHE_TTL_SECONDS:45}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}